<!-- ===================== ADD / EDIT TENANT SHEET ===================== -->
<div class="sheet-overlay" id="sheetAddTenant">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Add tenant</div>
    
    <div class="field">
      <label for="atName">Name</label>
      <input type="text" id="atName" placeholder="Tenant full name">
    </div>
    
    <div class="field">
      <label for="atPhone">Phone (optional)</label>
      <input type="tel" id="atPhone" placeholder="+91 9xxxxxxxxx">
    </div>

    <div class="field">
      <label for="atAddress">Address</label>
      <textarea id="atAddress" rows="2" placeholder="Full address"></textarea>
    </div>

    <div class="field">
      <label for="atProperty">Lot / property</label>
      <select id="atProperty"></select>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="atSpot">Spot / slot no.</label>
        <input type="text" id="atSpot" placeholder="e.g. B-12">
      </div>
      <div class="field">
        <label for="atAdvance">Advance Amount (₹)</label>
        <input type="number" inputmode="numeric" id="atAdvance" class="mono-input" placeholder="0">
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="atFixedRent">Fixed Rent (₹)</label>
        <input type="number" inputmode="numeric" id="atFixedRent" class="mono-input" placeholder="0">
      </div>
      <div class="field">
        <label for="atRevisedRent">Revised Rent (₹)</label>
        <input type="number" inputmode="numeric" id="atRevisedRent" class="mono-input" placeholder="0">
      </div>
    </div>

    <div class="field">
      <label for="atRent">Active Monthly Rent (₹)</label>
      <input type="number" inputmode="numeric" id="atRent" class="mono-input" placeholder="0">
    </div>

    <div class="field">
      <label for="atVehicleType">Vehicle Type</label>
      <select id="atVehicleType">
        <option value="Car">Car</option>
        <option value="Bike">Bike</option>
        <option value="Both">Both (Car & Bike)</option>
      </select>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="atNoCars">No. of Cars</label>
        <input type="number" inputmode="numeric" id="atNoCars" placeholder="0">
      </div>
      <div class="field">
        <label for="atNoBikes">No. of Bikes</label>
        <input type="number" inputmode="numeric" id="atNoBikes" placeholder="0">
      </div>
    </div>

    <div class="field">
      <label for="atStart">Tenancy Start Date</label>
      <input type="date" id="atStart">
    </div>

    <div class="field-row">
      <div class="field">
        <label for="atAgrStart">Agreement Start Date</label>
        <input type="date" id="atAgrStart">
      </div>
      <div class="field">
        <label for="atAgrEnd">Agreement End Date</label>
        <input type="date" id="atAgrEnd">
      </div>
    </div>

    <button class="btn btn-primary" id="btnSaveTenant">Save tenant</button>
    <div id="atEditId" style="display:none"></div>
  </div>
</div>
